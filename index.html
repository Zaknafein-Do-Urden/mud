<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>江湖夜雨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 加载画面（D-094）：写在 HTML 里，脚本还没跑起来时就盖住页面；加载完才撤掉，期间什么都点不到 -->
  <div id="loading" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="ld-box">
      <div class="ld-title">江湖夜雨</div>
      <div class="ld-ver" id="ld-ver"></div>
      <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
      <div class="ld-text" id="ld-text">正在读取存档……</div>
    </div>
  </div>

  <div id="app">
    <!-- 顶栏（D-093）：常用的大按钮放在这里；导出、导入、新游戏收进"系统" -->
    <header>
      <h1><span id="title">江湖夜雨</span><small id="version"></small></h1>
      <nav class="top-nav">
        <button id="char-toggle" class="top-btn" title="状态、武功、天赋、合击、背包">人物</button>
        <button id="journal-toggle" class="top-btn" title="主线进度、任务清单">江湖</button>
        <button id="map-toggle" class="top-btn" title="显示 / 收起地图">地图</button>
        <button id="world-toggle" class="top-btn" title="查看城市与马车路线">大地图</button>
        <button id="system-toggle" class="top-btn" title="导出、导入存档，新游戏">系统</button>
      </nav>
    </header>

    <div id="status"><span id="status-text"></span></div>

    <div id="layout">
      <div id="main-col">
        <div id="party" hidden></div>
        <main id="output" aria-live="polite"></main>
        <div id="combat" hidden></div>
        <div id="quick"></div>
        <form id="input-form" autocomplete="off">
          <span class="prompt">&gt;</span>
          <input id="input" placeholder="输入命令，Tab 补全，如 talk lqg" autofocus>
        </form>
      </div>

      <!-- 地图：电脑上在右边一栏，手机上在文字上方（D-093） -->
      <aside id="side">
        <div class="side-head"><span id="map-title">地图</span><button id="map-close" title="收起地图">收起</button></div>
        <div id="map"></div>
        <p class="side-tip">点击去过的地方可以自动走过去</p>
      </aside>
    </div>
  </div>

  <!-- 首次教程（D-096）：每个角色只弹一次，记在存档的 tutorials 里 -->
  <dialog id="tutorial">
    <div class="world-head"><h2 id="tutorial-title"></h2></div>
    <div id="tutorial-body" class="tutorial-body"></div>
    <div class="row"><button id="tutorial-ok">知道了</button></div>
  </dialog>

  <dialog id="system-dialog">
    <div class="world-head"><h2>系统</h2><button id="system-close" title="关闭">×</button></div>
    <div class="system-menu">
      <button id="btn-export" class="sys-btn">导出存档<small>存档变成一段文字，可以复制或下载，在别的浏览器导入</small></button>
      <button id="btn-import" class="sys-btn">导入存档<small>从文字或 .txt 文件读回存档</small></button>
      <button id="btn-new" class="sys-btn danger">新游戏<small>放弃当前进度，重新开始</small></button>
    </div>
  </dialog>

  <dialog id="create-dialog">
    <form id="create-form">
      <h2>行走江湖，报上名来</h2>
      <div class="create-row">
        <label>姓 <input id="cr-surname" maxlength="2" required placeholder="如 林"></label>
        <label>名 <input id="cr-given" maxlength="3" required placeholder="如 平之"></label>
      </div>
      <div class="create-row">
        <span>性别</span>
        <label><input type="radio" name="cr-gender" value="男" checked> 男</label>
        <label><input type="radio" name="cr-gender" value="女"> 女</label>
      </div>
      <p class="create-hint">江湖中人会用这个名字称呼你，部分场景和台词会因性别略有不同。</p>
      <p id="cr-error" class="err"></p>
      <div class="row"><button type="submit">踏入江湖</button></div>
    </form>
  </dialog>

  <dialog id="panel">
    <div class="world-head"><h2 id="panel-title"></h2><button id="panel-close" title="关闭">×</button></div>
    <div id="panel-tabs"></div>
    <div id="panel-body"></div>
    <p id="panel-feedback"></p>
  </dialog>

  <dialog id="lobby">
    <div class="world-head"><h2>搜索队伍</h2><button id="lobby-close" title="关闭">×</button></div>
    <p class="pn-hint">和你在同一个旅店或门派驻地、队伍还没满的玩家（列表每 3 秒刷新）：</p>
    <div id="lobby-list"></div>
  </dialog>

  <dialog id="world-dialog">
    <div class="world-head"><h2>大地图</h2><button id="world-close" title="关闭">×</button></div>
    <div id="world-map"></div>
    <p id="world-info" class="world-info"></p>
  </dialog>

  <dialog id="save-dialog">
    <form method="dialog">
      <h2 id="save-title"></h2>
      <p id="save-hint"></p>
      <textarea id="save-text" rows="8" spellcheck="false"></textarea>
      <p id="save-error" class="err"></p>
      <div class="row">
        <span id="export-actions">
          <button type="button" id="btn-copy">复制</button>
          <button type="button" id="btn-download">下载 .txt</button>
        </span>
        <span id="import-actions">
          <label class="file-btn">选择文件<input type="file" id="file-input" accept=".txt,text/plain" hidden></label>
          <button type="button" id="btn-do-import">导入</button>
        </span>
        <button value="close">关闭</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
